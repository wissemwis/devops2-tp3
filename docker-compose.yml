name: tp3

services:
  # ---------------- Base de données ----------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Pas de "ports" : la base n'est joignable que depuis les autres conteneurs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # ---------------- Administration de la base ----------------
  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Écoute en IPv4 (évite un crash sur les machines où IPv6 est désactivé)
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    # ---------------- CMS headless (API) ----------------
  strapi:
    build: ./backend
    image: tp2/strapi:latest
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - strapi-uploads:/opt/app/public/uploads
    ports:
      - "${STRAPI_PORT:-1337}:1337"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1337/_health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # ---------------- Front-end ----------------
  frontend:
    build: ./frontend
    image: tp2/frontend:latest
    restart: unless-stopped
    environment:
      # Appel serveur à serveur : on utilise le nom du service, pas "localhost"
      STRAPI_URL: http://strapi:1337
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      strapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------- Tests (profil "test") ----------------
  unit:
    build:
      context: ./frontend
      target: test
    image: tp3/frontend-test:latest
    profiles: ["test"]
    command: ["npm", "run", "test:unit"]
    volumes:
      - ./frontend:/app
      # Volume anonyme : garde le node_modules de l'image au lieu de celui (absent) de l'hôte
      - /app/node_modules

  integration:
    build:
      context: ./frontend
      target: test
    image: tp3/frontend-test:latest
    profiles: ["test"]
    command: ["npm", "run", "test:integration"]
    environment:
      STRAPI_URL: http://strapi:1337
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      strapi:
        condition: service_healthy

  e2e:
    build:
      context: ./frontend
      target: e2e
    image: tp3/frontend-e2e:latest
    profiles: ["e2e"]
    command: ["npm", "run", "test:e2e"]
    environment:
      BASE_URL: http://frontend:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      frontend:
        condition: service_healthy

  # ---------------- Qualité du code (profil "quality") ----------------
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    profiles: ["quality"]
    environment:
      # Évite l'arrêt d'Elasticsearch sur les machines où vm.max_map_count est trop bas
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    ports:
      - "${SONAR_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0
    profiles: ["quality"]
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN}
    volumes:
      - ./frontend:/usr/src
    depends_on:
      sonarqube:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin-data:
  strapi-uploads:
  sonar-data:
  sonar-extensions:
  sonar-logs:
